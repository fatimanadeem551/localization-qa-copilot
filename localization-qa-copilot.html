<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian — Localization QA Copilot</title>
<style>
  :root{
    --paper:#efece3;
    --ink:#20221f;
    --ink-soft:#5a5c53;
    --line:#c9c5b6;
    --good:#3d5a4e;
    --warn:#b8862f;
    --bad:#8a4a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    line-height:1.5;
  }
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 80px;}
  .kicker{
    font-family: Georgia, serif;
    font-style: italic;
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 6px;
  }
  h1{
    font-size: 32px;
    font-weight: 600;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .sub{
    color:var(--ink-soft);
    max-width: 62ch;
    font-size:16px;
    margin:0 0 28px;
  }
  hr.rule{border:none;border-top:2px solid var(--ink);margin:24px 0 28px;}

  .panel{
    border:1.5px solid var(--ink);
    padding:20px;
    margin-bottom: 24px;
  }
  .field-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  textarea, input[type=text], input[type=password]{
    width:100%;
    font-family: "Iowan Old Style", Georgia, serif;
    font-size:16px;
    padding:12px;
    border:1px solid var(--line);
    background:#fbfaf6;
    color:var(--ink);
    resize: vertical;
  }
  .pair{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:16px;
  }
  @media (max-width: 700px){
    .pair{grid-template-columns: 1fr;}
  }
  .lang-label{
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .urdu-input{
    direction: rtl;
    font-size:18px;
    min-height:110px;
  }
  .eng-input{min-height:110px;}

  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    gap:12px;
    flex-wrap:wrap;
  }
  .hint{font-size:13px;color:var(--ink-soft);}

  button{
    font-family: inherit;
    font-size:15px;
    cursor:pointer;
    border-radius:2px;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    border:1.5px solid var(--ink);
    padding:10px 20px;
  }
  .btn-primary:disabled{opacity:0.5;cursor:default;}
  .btn-secondary{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line);
    padding:10px 20px;
  }

  .rubric-note{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .results{
    border:1.5px solid var(--ink);
    margin-bottom:24px;
  }
  .results-head{
    padding:18px 20px 14px;
    border-bottom:1.5px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  .results-head h2{
    font-size:20px;
    margin:0;
  }
  .overall-score{
    font-size:28px;
    font-weight:600;
  }
  .overall-score span{
    font-size:14px;
    color:var(--ink-soft);
    font-weight:400;
  }

  .dims{
    padding:18px 20px;
  }
  .dim-row{
    display:grid;
    grid-template-columns: 140px 1fr 44px;
    align-items:center;
    gap:14px;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .dim-row:last-child{border-bottom:none;}
  .dim-name{font-size:14px;}
  .dim-bar-track{
    height:8px;
    background:#dedad0;
    position:relative;
  }
  .dim-bar-fill{
    height:100%;
  }
  .dim-score{font-size:14px; text-align:right; font-variant-numeric: tabular-nums;}

  .notes-box{
    border-top:1.5px solid var(--ink);
    padding:18px 20px;
    font-size:15px;
    white-space:pre-wrap;
  }
  .placeholder{font-style:italic;color:var(--ink-soft);}
  .loading-text{color:var(--ink-soft); font-style:italic; padding:18px 20px;}
  .error-text{color:var(--bad); padding:18px 20px;}

  .global-error{
    border:1.5px solid var(--bad);
    background: #f7ece9;
    color: var(--bad);
    padding:12px 16px;
    margin-bottom:20px;
    font-size:14px;
  }

  .history{
    border:1.5px solid var(--line);
    margin-bottom:24px;
  }
  .history-head{
    padding:12px 20px;
    font-size:13px;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
  }
  .history-item{
    padding:12px 20px;
    border-bottom:1px dashed var(--line);
    font-size:14px;
    display:flex;
    justify-content:space-between;
    gap:12px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-score{font-variant-numeric: tabular-nums; color:var(--ink-soft);}

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){

  const RUBRIC = [
    { id: 'accuracy', name: 'Accuracy', desc: 'Does the translation preserve the source meaning without addition, omission, or distortion?' },
    { id: 'fluency', name: 'Fluency', desc: 'Does the target text read naturally, with correct grammar and idiomatic phrasing?' },
    { id: 'terminology', name: 'Terminology', desc: 'Are domain-specific or recurring terms translated consistently and correctly?' },
    { id: 'style', name: 'Style / Register', desc: 'Does the tone and formality match the source and the intended audience?' },
    { id: 'locale', name: 'Locale Convention', desc: 'Are dates, numbers, honorifics, and cultural references adapted correctly for the target locale?' }
  ];

  let state = {
    english: 'Please update your payment information before the 15th to avoid service interruption.',
    urdu: 'براہ کرم 15 تاریخ سے پہلے اپنی ادائیگی کی معلومات کو اپ ڈیٹ کریں تاکہ سروس میں خلل نہ آئے۔',
    apiKey: '',
    running: false,
    globalError: null,
    result: null,     // { scores: {id: 0-100}, overall, notes }
    history: []        // [{ overall, timestamp, englishSnippet }]
  };

  const app = document.getElementById('app');

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function scoreColor(score){
    if (score >= 80) return 'var(--good)';
    if (score >= 55) return 'var(--warn)';
    return 'var(--bad)';
  }

  function render(){
    const rubricRows = RUBRIC.map(r => `<div class="rubric-note"><b>${r.name}:</b> ${r.desc}</div>`).join('');

    let resultsHtml = '';
    if (state.running) {
      resultsHtml = `
        <div class="results">
          <div class="results-head"><h2>Evaluation</h2></div>
          <div class="loading-text">Scoring segment pair…</div>
        </div>`;
    } else if (state.result && state.result.error) {
      resultsHtml = `
        <div class="results">
          <div class="results-head"><h2>Evaluation</h2></div>
          <div class="error-text">Error: ${escapeHtml(state.result.error)}</div>
        </div>`;
    } else if (state.result) {
      const r = state.result;
      const dimRows = RUBRIC.map(d => {
        const s = r.scores[d.id] ?? 0;
        return `
          <div class="dim-row">
            <div class="dim-name">${d.name}</div>
            <div class="dim-bar-track"><div class="dim-bar-fill" style="width:${s}%; background:${scoreColor(s)};"></div></div>
            <div class="dim-score">${s}</div>
          </div>`;
      }).join('');

      resultsHtml = `
        <div class="results">
          <div class="results-head">
            <h2>Evaluation</h2>
            <div class="overall-score" style="color:${scoreColor(r.overall)}">${r.overall}<span> / 100 overall</span></div>
          </div>
          <div class="dims">${dimRows}</div>
          <div class="notes-box">${escapeHtml(r.notes || '')}</div>
        </div>`;
    } else {
      resultsHtml = `
        <div class="results">
          <div class="results-head"><h2>Evaluation</h2></div>
          <div class="loading-text placeholder">Run an evaluation to see scores here.</div>
        </div>`;
    }

    let historyHtml = '';
    if (state.history.length) {
      const items = state.history.slice().reverse().map(h => `
        <div class="history-item">
          <span>${escapeHtml(h.englishSnippet)}</span>
          <span class="history-score" style="color:${scoreColor(h.overall)}">${h.overall}/100</span>
        </div>`).join('');
      historyHtml = `
        <div class="history">
          <div class="history-head">PAST EVALUATIONS (this session)</div>
          ${items}
        </div>`;
    }

    app.innerHTML = `
      <p class="kicker">Meridian — localization QA copilot</p>
      <h1>Score a segment pair against an SQR rubric.</h1>
      <p class="sub">Paste an English source and its Urdu translation. Meridian scores the pair across five localization quality dimensions and flags anything that needs a second look.</p>
      <hr class="rule">

      ${state.globalError ? `<div class="global-error">${escapeHtml(state.globalError)}</div>` : ''}

      <div class="panel" style="margin-bottom:16px;">
        <div class="field-label">YOUR ANTHROPIC API KEY</div>
        <input type="password" id="api-key" placeholder="sk-ant-..." value="${escapeHtml(state.apiKey)}">
        <p class="hint" style="margin:8px 0 0;">Stored only in this browser tab — never sent anywhere but Anthropic's API. Get a key at console.anthropic.com.</p>
      </div>

      <div class="panel">
        <div class="pair">
          <div>
            <div class="lang-label">SOURCE — ENGLISH</div>
            <textarea id="english-input" class="eng-input">${escapeHtml(state.english)}</textarea>
          </div>
          <div>
            <div class="lang-label">TARGET — URDU</div>
            <textarea id="urdu-input" class="urdu-input" dir="rtl">${escapeHtml(state.urdu)}</textarea>
          </div>
        </div>
        <div class="row-between">
          <span class="hint">Scored on: accuracy, fluency, terminology, style/register, locale convention.</span>
        </div>
        <div class="row-between">
          <button class="btn-secondary" id="clear-btn">Clear</button>
          <div style="display:flex; gap:10px;">
            <button class="btn-secondary" id="demo-btn">See example output</button>
            <button class="btn-primary" id="run-btn" ${state.running ? 'disabled' : ''}>${state.running ? 'Scoring…' : 'Run evaluation'}</button>
          </div>
        </div>
      </div>

      ${resultsHtml}
      ${historyHtml}

      <div class="panel" style="border-color:var(--line);">
        <div class="field-label">RUBRIC REFERENCE</div>
        ${rubricRows}
      </div>

      <footer>MERIDIAN · built with the Claude API</footer>
    `;

    document.getElementById('api-key').addEventListener('input', (e) => { state.apiKey = e.target.value; });
    document.getElementById('english-input').addEventListener('input', (e) => { state.english = e.target.value; });
    document.getElementById('urdu-input').addEventListener('input', (e) => { state.urdu = e.target.value; });
    document.getElementById('run-btn').addEventListener('click', runEvaluation);
    document.getElementById('demo-btn').addEventListener('click', showDemoResult);
    document.getElementById('clear-btn').addEventListener('click', () => {
      state.english = '';
      state.urdu = '';
      state.result = null;
      state.globalError = null;
      render();
    });
  }

  function showDemoResult(){
    state.globalError = null;
    state.result = {
      scores: { accuracy: 92, fluency: 78, terminology: 88, style: 70, locale: 95 },
      overall: 85,
      notes: "Meaning is preserved accurately, and the payment/deadline terminology is handled correctly and consistently. Fluency dips slightly — the sentence structure mirrors the English word order rather than a more natural Urdu construction, which a native reader would notice. Style is a touch too formal for what reads like a routine customer notice; a warmer register would land better. Locale conventions (date format, honorific tone) are well adapted for a Pakistani Urdu-speaking audience."
    };
    state.history.push({ overall: 85, englishSnippet: state.english.slice(0, 60) + (state.english.length > 60 ? '…' : '') + ' (example)' });
    render();
  }

  async function runEvaluation(){
    if (!state.english.trim() || !state.urdu.trim()) {
      state.globalError = 'Enter both the English source and the Urdu translation before running an evaluation.';
      render();
      return;
    }
    if (!state.apiKey.trim()) {
      state.globalError = 'Enter your Anthropic API key above before running an evaluation.';
      render();
      return;
    }

    state.globalError = null;
    state.running = true;
    state.result = null;
    render();

    const systemPrompt = `You are a localization quality evaluator specializing in English-to-Urdu translation. Score the given segment pair on five dimensions, each 0-100: accuracy, fluency, terminology, style, locale. Respond ONLY with valid JSON in this exact shape, no preamble, no markdown fences: {"scores":{"accuracy":0,"fluency":0,"terminology":0,"style":0,"locale":0},"overall":0,"notes":"2-4 sentences of specific, actionable feedback on what was done well and what needs revision"}`;

    const userPrompt = `English source:\n${state.english}\n\nUrdu translation:\n${state.urdu}`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': state.apiKey.trim(),
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 600,
          system: systemPrompt,
          messages: [{ role: 'user', content: userPrompt }]
        })
      });

      if (!response.ok) {
        let detail = '';
        try {
          const errJson = await response.json();
          detail = errJson?.error?.message || JSON.stringify(errJson);
        } catch(_) {
          detail = await response.text();
        }
        throw new Error(`HTTP ${response.status} — ${detail}`);
      }

      const data = await response.json();
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const raw = textBlocks.join('\n').trim();
      const cleaned = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(cleaned);

      state.result = parsed;
      state.history.push({
        overall: parsed.overall,
        englishSnippet: state.english.slice(0, 60) + (state.english.length > 60 ? '…' : '')
      });
    } catch (err) {
      state.result = { error: err.message || 'Unknown error.' };
    }

    state.running = false;
    render();
  }

  render();
})();
</script>
</body>
</html>
